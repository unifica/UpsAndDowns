<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A digital magic trick using AI and facial / eye tracking" />
    <meta name="theme-color" content="#6c63ff" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <title>Ups and Downs</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Technique 1: Full-screen luminance overlay -->
    <div id="gaze-overlay" aria-hidden="true"></div>
    <div class="edge-word edge-word--top">
      <canvas class="up-noise" id="up-noise-canvas" aria-hidden="true"></canvas>
      <span class="up-text">UP</span>
      <canvas class="up-lines" id="up-lines-canvas" aria-hidden="true"></canvas>
      <div class="debug-bar">
        <div class="debug-bar__track">
          <div class="debug-bar__fill" id="debug-bar-up-fill"></div>
        </div>
        <span class="debug-bar__label" id="debug-bar-up-label">—</span>
      </div>
    </div>
    <div class="edge-word edge-word--bottom">
      <span class="down-text">DOWN</span>
      <div class="debug-bar">
        <div class="debug-bar__track">
          <div class="debug-bar__fill" id="debug-bar-down-fill"></div>
        </div>
        <span class="debug-bar__label" id="debug-bar-down-label">—</span>
      </div>
    </div>
    <div id="app">
      <main class="app-main">
        <section id="camera-section" class="card">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
        </section>

        <section id="controls" class="card">
          <button id="start-btn" class="btn btn-primary">Start</button>
          <button id="toggle-preview-btn" class="btn btn-secondary" disabled>Hide Preview</button>
          <div class="pupil-readout" aria-label="Pupil size indicator">
            <span class="pupil-readout__label">Pupil size</span>
            <span class="pupil-readout__value" id="pupil-size-value">—</span>
          </div>
          <p id="status" class="status-text" aria-hidden="true"></p>
        </section>
      </main>
    </div>

    <!-- TensorFlow.js + MediaPipe face-landmarks-detection loaded as classic
         scripts so that window.faceLandmarksDetection is available before the
         ES-module entry point runs. -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.6/dist/face-landmarks-detection.min.js"></script>
    <script src="js/upEffects.js"></script>
    <script src="js/app.js" type="module"></script>
  </body>
</html>
